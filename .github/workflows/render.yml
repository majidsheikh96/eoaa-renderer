name: Render Video
run-name: "Render: ${{ inputs.video_title || inputs.video_id }}${{ inputs.chunks != '' && ' (chunked)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: 'Episode ID / slug (R2 prefix under episodes/<id>/)'
        required: true
        type: string
      chunks:
        description: 'JSON array of chunk indices for parallel render, e.g. [0,1,2,3]. Empty = single full render.'
        required: false
        default: ''
        type: string
      quality:
        description: 'Render quality'
        required: false
        type: choice
        default: 'standard'
        options:
          - standard
          - draft
      thumbnail_url:
        description: 'Public URL of thumbnail JPEG to embed as cover (optional)'
        required: false
        type: string
      video_title:
        description: 'Human-readable title (for the run name only)'
        required: false
        type: string

# Shared R2 / S3 credentials for every job.
env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
  R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto

jobs:
  # ── Legacy: one job renders the whole episode (used when `chunks` is empty; shorts). ──
  full:
    if: ${{ inputs.chunks == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODE: full
      VIDEO_ID: ${{ inputs.video_id }}
      RENDER_QUALITY: ${{ inputs.quality }}
      THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install system dependencies (Chrome libs + FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libasound2t64 ffmpeg
      - name: Run renderer (full)
        run: node render.js
      - name: Name the MP4 after the episode
        if: always()
        run: '[ -f output.mp4 ] && cp output.mp4 "${{ inputs.video_id }}.mp4" || true'
      - name: Upload MP4 artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_id }}
          path: ${{ inputs.video_id }}.mp4
          if-no-files-found: ignore
          retention-days: 14

  # ── Chunked: render each chunk in parallel, then concat. ──
  render_chunks:
    if: ${{ inputs.chunks != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(inputs.chunks != '' && inputs.chunks || '[]') }}
    env:
      MODE: chunk
      VIDEO_ID: ${{ inputs.video_id }}
      CHUNK_ID: ${{ matrix.chunk }}
      RENDER_QUALITY: ${{ inputs.quality }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install system dependencies (Chrome libs + FFmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxrandr2 libgbm1 libasound2t64 ffmpeg
      - name: Run renderer (chunk ${{ matrix.chunk }})
        run: node render.js

  concat:
    if: ${{ inputs.chunks != '' }}
    needs: render_chunks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: concat
      VIDEO_ID: ${{ inputs.video_id }}
      THUMBNAIL_URL: ${{ inputs.thumbnail_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Run renderer (concat)
        run: node render.js
      - name: Name the MP4 after the episode
        if: always()
        run: '[ -f output.mp4 ] && cp output.mp4 "${{ inputs.video_id }}.mp4" || true'
      - name: Upload final MP4 artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.video_id }}
          path: ${{ inputs.video_id }}.mp4
          if-no-files-found: ignore
          retention-days: 14
